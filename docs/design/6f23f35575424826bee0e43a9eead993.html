<!DOCTYPE html>

<html class="h-full w-full" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape" name="viewport"/>
<title>重生之逆袭1990 · 第 1 集 - 播放器</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            // M3 Dark Palette from Legado M3 Design System
            background: "#12140E",
            surface: "#12140E",
            onSurface: "#E2E3D8",
            surfaceContainerLowest: "#0C0F09",
            surfaceContainerLow: "#1A1C16",
            surfaceContainer: "#1E201A",
            surfaceContainerHigh: "#282B24",
            surfaceContainerHighest: "#33362E",
            surfaceVariant: "#44483D",
            onSurfaceVariant: "#C5C8BA",
            primary: "#B1D18A",
            onPrimary: "#1F3701",
            primaryContainer: "#354E16",
            onPrimaryContainer: "#CDEDA3",
            secondary: "#BFCBAD",
            secondaryContainer: "#404A33",
            tertiary: "#A0D0CB",
            tertiaryContainer: "#1F4E4B",
            outline: "#8F9285",
            outlineVariant: "#44483D"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    /* Material Symbols base config */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }

    /* Prevent accidental text selection in video player UI */
    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Hide range input native thumb styling and construct pure M3 slider */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 9999px;
      background-color: #B1D18A;
      box-shadow: 0 0 0 4px rgba(177, 209, 138, 0.25);
      cursor: pointer;
      margin-top: -6px;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.25);
    }
  </style>
</head>
<body class="bg-background text-onSurface w-full h-screen overflow-hidden m-0 p-0 font-body relative flex items-center justify-center select-none">
<!-- ==================== 1. 底层视频场景 (16:9 / 20:9 横屏全屏铺满) ==================== -->
<div class="absolute inset-0 w-full h-full z-0 overflow-hidden bg-black flex items-center justify-center">
<div class="w-full h-full bg-cover bg-center transition-transform duration-700 scale-100" data-alt="A cinematic cinematic still from a 1990s Chinese drama set in a nostalgic rustic street market during golden hour. A determined young entrepreneur in vintage 1990 denim jacket stands firmly next to an old green bicycle and wooden crates, conversing with local merchants. Warm amber late afternoon sunlight illuminates the misty dust particles in the air, framed with retro cinematic depth of field and muted earth tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCZNZnYjUajs6aqr2Q9kbvhnA8WvPfca8iVMjODH5_LdQysV7rINRfIC3O4wpH4uYQvavr3rOYJEB-lzQSLTuoM5uYADI7TQi0pgk3igJ9YTz2LDS4bya6fgqFsCPwaiVP-V1F9tV0KjUOwe6MhJLhS2nxEItKN9tNjPk_ANQKoB2niudOxh-ht7sT-w6hjbaDdv7m4kvtmYLYgEotEI5_JUb7tvnkSZYaNueWaC49cZTi2OzmqcxtcNmqKxxm9GdEkX4PMsFgqrOjK')">
</div>
<!-- 全局防反光微暗蒙版 -->
<div class="absolute inset-0 bg-black/25 pointer-events-none"></div>
<!-- 顶部渐变遮罩 -->
<div class="absolute top-0 left-0 right-0 h-28 bg-gradient-to-b from-black/85 via-black/40 to-transparent pointer-events-none"></div>
<!-- 底部渐变遮罩 -->
<div class="absolute bottom-0 left-0 right-0 h-36 bg-gradient-to-t from-black/90 via-black/50 to-transparent pointer-events-none"></div>
</div>
<!-- ==================== 2. 顶部工具栏 (TopNavBar Shared Component) ==================== -->
<header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-6 pt-3 pb-6 w-full bg-gradient-to-b from-black/80 via-black/40 to-transparent">
<!-- 左侧：返回键与剧集标题 -->
<div class="flex items-center gap-3">
<button aria-label="返回上一页" class="w-10 h-10 min-w-[40px] flex items-center justify-center rounded-full bg-surfaceContainer/50 backdrop-blur-md text-white hover:bg-white/10 active:scale-95 transition-all duration-150 border border-outlineVariant/30" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<div class="flex items-baseline gap-2 pl-1">
<h1 class="text-base font-semibold text-white tracking-wide font-headline">
          重生之逆袭1990
        </h1>
<span class="text-xs font-medium text-white/80 bg-white/15 px-2 py-0.5 rounded-full border border-white/10 backdrop-blur-sm">
          第 1 集
        </span>
</div>
</div>
<!-- 右侧：屏幕旋转锁定/解锁 -->
<div class="flex items-center">
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surfaceContainer/60 backdrop-blur-md hover:bg-white/15 text-white active:scale-95 transition-all duration-150 border border-outlineVariant/35 text-xs font-medium" type="button">
<span class="material-symbols-outlined text-[18px]">screen_rotation</span>
<span>解锁旋转</span>
</button>
</div>
</header>
<!-- ==================== 3. 画面正中央：大尺寸圆形 Play/Pause 按钮 ==================== -->
<div class="relative z-20 flex items-center justify-center pointer-events-auto">
<button aria-label="播放或暂停" class="group w-[72px] h-[72px] rounded-full bg-black/60 backdrop-blur-xl border border-white/20 flex items-center justify-center shadow-2xl hover:scale-105 active:scale-90 transition-all duration-200" id="centerPlayBtn" type="button">
<span class="material-symbols-outlined fill text-primary text-[42px] transition-transform group-hover:scale-105 ml-1" id="centerPlayIcon">
        play_arrow
      </span>
</button>
</div>
<!-- ==================== 4. 左右两侧快速切集按钮 (悬浮侧边触发区) ==================== -->
<!-- 左侧：上一集悬浮触发 -->
<div class="absolute left-6 top-1/2 -translate-y-1/2 z-20">
<button class="group flex flex-col items-center justify-center w-12 h-14 rounded-2xl bg-surfaceContainer/60 hover:bg-surfaceContainerHigh/80 backdrop-blur-md border border-outlineVariant/30 text-white/90 active:scale-95 transition-all duration-150 shadow-lg" title="上一集" type="button">
<span class="material-symbols-outlined text-[24px] text-white group-hover:text-primary transition-colors">skip_previous</span>
<span class="text-[10px] font-medium text-onSurfaceVariant mt-0.5 scale-90">上集</span>
</button>
</div>
<!-- 右侧：下一集悬浮触发 -->
<div class="absolute right-6 top-1/2 -translate-y-1/2 z-20">
<button class="group flex flex-col items-center justify-center w-12 h-14 rounded-2xl bg-surfaceContainer/60 hover:bg-surfaceContainerHigh/80 backdrop-blur-md border border-outlineVariant/30 text-white/90 active:scale-95 transition-all duration-150 shadow-lg" title="下一集" type="button">
<span class="material-symbols-outlined text-[24px] text-white group-hover:text-primary transition-colors">skip_next</span>
<span class="text-[10px] font-medium text-onSurfaceVariant mt-0.5 scale-90">下集</span>
</button>
</div>
<!-- ==================== 5. 底部控制区 (Bottom Controls Overlay) ==================== -->
<footer class="fixed bottom-0 left-0 right-0 z-30 px-6 pb-4 pt-4 flex flex-col gap-2.5 bg-gradient-to-t from-black/95 via-black/60 to-transparent">
<!-- 第一行：进度滑块与时间显示 -->
<div class="flex items-center gap-3 w-full">
<!-- 当前时间 -->
<span class="text-xs font-semibold text-white tracking-wider font-label w-11 text-right" id="currentTime">
        03:12
      </span>
<!-- Material 3 风格进度条轨道 -->
<div class="relative flex-1 flex items-center h-6 cursor-pointer">
<!-- 背景总轨道 -->
<div class="absolute w-full h-1 bg-white/20 rounded-full overflow-hidden">
<!-- 缓冲条 -->
<div class="w-[45%] h-full bg-white/35 rounded-full"></div>
</div>
<!-- 已播放进度颜色条 -->
<div class="absolute h-1 bg-primary rounded-full" id="progressFill" style="width: 25.1%;"></div>
<!-- 纯原生交互滑轨 (透明叠加) -->
<input aria-label="播放进度调整" class="relative w-full h-4 z-10 cursor-pointer" id="seekBar" max="765" min="0" step="1" type="range" value="192"/>
</div>
<!-- 总时长 -->
<span class="text-xs font-medium text-onSurfaceVariant tracking-wider font-label w-11 text-left">
        12:45
      </span>
</div>
<!-- 第二行：底部功能按钮组 (全屏纯净模式) -->
<div class="flex items-center justify-between w-full pt-1">
<!-- 左侧按钮群：胶囊型 上一集 / 下一集 -->
<div class="flex items-center gap-2">
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-surfaceContainer/60 hover:bg-surfaceContainerHigh/80 backdrop-blur-md border border-outlineVariant/30 text-white/90 text-xs font-medium active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">skip_previous</span>
<span>上一集</span>
</button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-surfaceContainer/60 hover:bg-surfaceContainerHigh/80 backdrop-blur-md border border-outlineVariant/30 text-white/90 text-xs font-medium active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">skip_next</span>
<span>下一集</span>
</button>
</div>
<!-- 右侧按钮群：选集 / 倍速切换 -->
<div class="flex items-center gap-2">
<!-- 选集胶囊 -->
<button class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surfaceContainer/60 hover:bg-surfaceContainerHigh/80 backdrop-blur-md border border-outlineVariant/30 text-white text-xs font-medium active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px] text-primary">view_list</span>
<span>选集</span>
</button>
<!-- 倍速切换胶囊 -->
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-surfaceContainer/60 hover:bg-surfaceContainerHigh/80 backdrop-blur-md border border-outlineVariant/30 text-white text-xs font-medium active:scale-95 transition-all" id="speedBtn" type="button">
<span class="material-symbols-outlined text-[18px]">speed</span>
<span id="speedText">1.0x</span>
</button>
</div>
</div>
</footer>
<!-- 轻量交互控制逻辑 (Play/Pause, Slider, Speed) -->
<script>
    const centerPlayBtn = document.getElementById('centerPlayBtn');
    const centerPlayIcon = document.getElementById('centerPlayIcon');
    const seekBar = document.getElementById('seekBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeText = document.getElementById('currentTime');
    const speedBtn = document.getElementById('speedBtn');
    const speedText = document.getElementById('speedText');

    let isPlaying = true;
    const speeds = ['1.0x', '1.25x', '1.5x', '2.0x', '0.75x'];
    let currentSpeedIdx = 0;

    // 格式化秒数
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // 播放/暂停切换
    centerPlayBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        centerPlayIcon.textContent = 'pause';
        centerPlayIcon.classList.remove('ml-1');
      } else {
        centerPlayIcon.textContent = 'play_arrow';
        centerPlayIcon.classList.add('ml-1');
      }
    });

    // 进度条拖拽实时联动
    seekBar.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      const max = parseFloat(e.target.max);
      const percent = (val / max) * 100;
      progressFill.style.width = percent + '%';
      currentTimeText.textContent = formatTime(val);
    });

    // 倍速点击轮播
    speedBtn.addEventListener('click', () => {
      currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
      speedText.textContent = speeds[currentSpeedIdx];
    });
  </script>
</body></html>
