name: Release APK

# 正式包只在打 tag 时产出：push 版本号 tag（如 3.26.18）→ 构建签名 release APK 并发布到本仓库 Releases。
# 客户端的「检查更新」读本仓库 Releases（AppUpdateGitHub.repoPath），更新日志用
# versionName 直接查 /releases/tags/{versionName}，所以 tag 必须是不带前缀的纯版本号。
on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # COMMIT_NUMBER 用提交总数换算 versionCode，需要完整历史。
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle 里的 aliyun 镜像面向国内开发机，在 GitHub runner 上会 502，
      # 且 Gradle 一旦判定某仓库失败就整个禁用它。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少仓库 Secret KEYSTORE_BASE64，无法产出正式签名包"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/bookreader-release.jks"

      - name: Compute version
        id: version
        run: |
          PROPERTIES_FILE="app/version.properties"
          MAJOR=$(grep '^VERSION_MAJOR' "$PROPERTIES_FILE" | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR' "$PROPERTIES_FILE" | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH' "$PROPERTIES_FILE" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep '^VERSION_SUFFIX' "$PROPERTIES_FILE" | cut -d'=' -f2 | tr -d '[:space:]')

          # versionCode 由 COMMIT_NUMBER 换算成 40000 + N：偏移量要压过无 COMMIT_NUMBER 时的
          # 兜底值 32640，否则 CI 产出的包无法覆盖安装本地构建的同版本包。
          COMMIT_COUNT=$(git rev-list --count HEAD)

          VERSION="$MAJOR.$MINOR.$PATCH"
          if [ "$SUFFIX" != "0" ]; then
            VERSION="$VERSION-beta.$COMMIT_COUNT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          COMMIT_NUMBER: ${{ steps.version.outputs.commit_count }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease \
            -PenableAbiSplits=false \
            -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/app/bookreader-release.jks" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon --no-configuration-cache

      # gradle 只在 RELEASE_STORE_FILE 存在时才挂签名配置，配置缺失会静默产出未签名的
      # release 包：装不上、也没法覆盖安装，所以必须在这里断言签名身份。
      - name: Verify the APK is signed with the release key
        run: |
          APK=$(find app/build/outputs/apk/app/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "没有产出 APK"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest' | head -n 1 | awk '{print $NF}')
          echo "签名证书 SHA-256: $DIGEST"
          if [ "$DIGEST" != "fb72a50266643b20fb1a67b9324b032ca8e0470ea443d36c1175ad8bce73ed05" ]; then
            echo "APK 不是用正式密钥库签名的"
            exit 1
          fi

      - name: Rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/app/release -maxdepth 1 -name '*.apk' | head -n 1)
          NAME="BookReader-${{ steps.version.outputs.version }}-universal.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "$GITHUB_WORKSPACE/$NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # 不带 v 前缀：客户端用 versionName 查 /releases/tags/{versionName}。
          # 手动触发时没有 tag，用算出来的版本号建，保证 /releases/latest 能取到。
          tag_name: ${{ steps.version.outputs.version }}
          name: BookReader ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
